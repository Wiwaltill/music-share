name: PHP checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3', '8.4']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: music_share_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptest"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: fileinfo, pdo_mysql, mbstring, zip
          coverage: none
      - name: Syntax check
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
      - name: Audio range regression tests
        run: php tests/audio_response_test.php
      - name: Audio HTTP regression tests
        run: python3 tests/audio_http_test.py
      - name: Database migration regression tests
        run: php tests/migrations_test.php
      - name: Album ZIP cache regression tests
        run: php tests/album_archive_test.php
      - name: Share and session security regression tests
        run: python3 tests/security_http_test.py
